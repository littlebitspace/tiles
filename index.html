<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#16141c;--pn:#221f2c;--ln:#3b3650;--tx:#e6e1ee;--ac:#ffc233;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--pn);border-bottom:1px solid var(--ln);align-items:center}
button{font:inherit;color:var(--tx);background:#2e2a42;border:1px solid var(--ln);padding:6px 10px;border-radius:3px;min-height:40px;touch-action:manipulation}
button.on{background:var(--ac);color:#000;border-color:var(--ac)}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sp{flex:1}
#msg{min-height:22px;padding:2px 8px;font-size:12px;color:var(--ac)}
#msg.err{color:#ff7a7a}
main{flex:1;overflow:auto;padding:8px}
.view{display:none;max-width:540px;margin:0 auto}.view.on{display:block}
canvas{display:block;image-rendering:pixelated;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;border:1px solid var(--ln);background:#000;margin:0 auto}
#bd{width:min(100%,54dvh)}
#ge{width:min(100%,288px)}#gc,#go{width:min(100%,320px)}
.row{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;align-items:center}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0 8px}
.s{height:38px;padding:0}.s.on{outline:3px solid var(--ac);outline-offset:1px}
summary{padding:8px 0;cursor:pointer}
h3{margin:16px 0 6px;font-size:14px;font-weight:700}
.mf{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.mf input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);padding:8px;border-radius:3px}
/* pixel skin: hard edges, bevelled buttons, stepped shadows, dithered ground */
:root{--bg:#1a1626;--pn:#262038;--ln:#463d66;--hi:#6a5f96;--lo:#0d0a15;--tx:#ece6f6}
html,body{font:15px/1.3 "Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:none;background:conic-gradient(#1d1930 25%,#1a1626 0 50%,#1d1930 0 75%,#1a1626 0) 0 0/8px 8px}
header{background:var(--pn);border-bottom:4px solid var(--lo);box-shadow:0 4px 0 var(--ln)}
button{border:3px solid var(--lo);border-radius:0;background:var(--ln);padding:4px 10px;min-height:42px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.18)}

button.on{background:var(--ac);color:#1a1100;border-color:var(--lo)}
.s{min-height:0}.s.on{outline:3px solid #fff;outline-offset:0}
canvas{border:3px solid var(--lo);box-shadow:0 0 0 3px var(--hi),4px 4px 0 3px var(--lo)}
.mf input{border:3px solid var(--lo);border-radius:0;background:#120e1c;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45)}
h3{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:16px}
h3::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--hi) 0 4px,transparent 4px 8px)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--ac)}details[open]>summary::before{content:"- "}
#msg{padding:4px 8px;min-height:26px}
button u{text-underline-offset:2px}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ic{width:24px;height:24px;display:block;fill:currentColor;shape-rendering:crispEdges;pointer-events:none}
#tip{position:fixed;z-index:50;background:#000;color:#fff;border:2px solid var(--ac,#fff);padding:3px 8px;font-size:13px;max-width:260px;pointer-events:none}
/* canvas view: board over glyph sheet on the left, one vertical stack of grouped controls on the right */
:root{--bs:min(calc(100vw - 124px),38dvh)}
#cv{display:grid;gap:8px;justify-content:center;align-items:start;grid-template-columns:var(--bs) 92px;grid-template-areas:"bd rc" "gc rc"}

#rc>*+*,#wc>*+*{border-top:3px dotted var(--ln);padding-top:8px}

#rc .ic,#wc .ic{margin:auto}
.cl{font-size:12px;margin:0 0 2px}
#rc .sw{margin:0 0 6px;gap:3px}#rc .s{height:26px;border-width:2px}

 #vW{max-width:none}

 #vC{max-width:none}

<header>
<button id="tC" class="on" data-ic="canvas" data-tip="Canvas (Ctrl+1 or Alt+1)"></button><button id="tW" data-ic="workshop" data-tip="Workshop (Ctrl+2 or Alt+2)"></button><span class="sp"></span>

<div id="rc">

</div>

</div>
</section>

<div id="wk">
<canvas id="ge" width="256" height="256"></canvas>
<div id="wc">

</div>

</div>

</section>

<script>
"use strict";
/* TILE cartridge format v7  (64x64 RGBA PNG; data lives in the LSBs, 1 bit per channel; 16 glyphs, 2 colours, 3 dither patterns)
   Alpha is always 255 and unused. The visible pixels are the artwork (each tile = 8x8 px).
   Red LSB plane, top-left 32x32 px = the tile set, pixel for pixel: a 4x4 sheet of 8x8 glyphs in reading order (glyph g at column g%4, row g>>2),
     bit 1 = set pixel, leftmost pixel = leftmost bit. A black/white 32x32 tile-set image therefore already is a valid plane.
   Green and Blue LSBs = payload stream: pixel order left->right, top->bottom, G then B; bytes MSB first. Capacity 4096*2/8 = 1024 bytes.
   Payload (all multi-byte ints little-endian):
     0  "TILE" (4)   4  version (7)   5  metaLen u16   7  palette 2x RGB (6), always #000000 and #ffffff in this editor
     13 map 64 x 14 bits (glyph4|fg1|bg1|dither8), packed back to back, first entry in the high bits (112)
        dither8 = 2 bits per quarter (bits 0-1 top-left, 2-3 top-right, 4-5 bottom-left, 6-7 bottom-right): 0 off, 1/2/3 = dither pattern 25/50/75%.
        Dither is a layer on top of the tile: where the pattern is set the pixel is painted palette colour 0 (black by default), over whatever the tile shows.
     125 dither patterns: 3 tiles x 8 row bytes, 25%, 50%, 75%, MSB = leftmost pixel, 1 = black pixel (24)
     149 metadata UTF-8 JSON {author,group,title,date} (metaLen)   then CRC-32 of all preceding payload bytes (4)
   The CRC does not cover the tile set plane, so a tile set can be edited in an image editor.
   Still read: version 6 (same, but the dither patterns sat under the glyph sheet in the red plane, x 0-23 y 32-39), version 5 (10-bit map entries, one
   dither bit per quarter = the 50% checker) and version 4 (6-bit entries, no dither). Versions 1 to 3 are not. */
const CAP=1024,MF=["author","group","title","date"],$=id=>document.getElementById(id);
const G=[[0,0,0,0,0,0,0,0],[255,255,255,255,255,255,255,255],[170,85,170,85,170,85,170,85],[170,0,170,0,170,0,170,0],[0,0,60,60,60,60,0,0],[0,24,60,126,126,60,24,0],[240,240,240,240,240,240,240,240],[0,0,0,0,255,255,255,255],[7,31,63,127,127,255,255,255],[224,248,252,254,254,255,255,255],[0,0,0,0,3,7,15,15],[0,0,0,0,192,224,240,240],[255,255,255,127,127,63,31,7],[255,255,255,254,254,252,248,224],[15,15,7,3,0,0,0,0],[240,240,224,192,0,0,0,0]];
/* premade dither families: a threshold 0-3 per pixel, nested so 25% is inside 50% is inside 75% */
const FAMS=(()=>{let z=12345;const rnd=()=>(z=(z*1664525+1013904223)>>>0)/4294967296,perm=[...Array(64).keys()];for(let i=63;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
 return{"Checker":(x,y)=>[[0,3],[2,1]][y&1][x&1],"Floral":(x,y)=>[[3,0,1,3],[1,2,2,0],[0,2,2,1],[3,1,0,3]][y&3][x&3],"Horizontal lines":(x,y)=>[0,2,1,3][y&3],"Vertical lines":(x,y)=>[0,2,1,3][x&3],"Diagonal lines":(x,y)=>(x+y)&3,"Noise":(x,y)=>perm[y*8+x]>>4}})();
const famTiles=n=>[1,2,3].map(k=>Array.from({length:8},(_,y)=>{let r=0;for(let x=0;x<8;x++)r=r<<1|(FAMS[n](x,y)<k?1:0);return r})),
 famName=d=>Object.keys(FAMS).find(n=>JSON.stringify(famTiles(n))===JSON.stringify(d))||"";
const def=()=>({version:7,metadata:{author:"",group:"",title:"",date:new Date().toISOString().slice(0,10)},
 palette:["#000000","#ffffff"],
 glyphs:Array.from({length:16},(_,i)=>Array.from({length:8},(_,j)=>G[i]?G[i][j%G[i].length]:0)),
 map:Array.from({length:64},()=>({glyph:0,fg:1,bg:0})),dither:famTiles("Checker")});

/* ---------- renderer (pure canvas drawing) ---------- */
/* dither: a separate layer on top of the tiles. A tile's d holds 2 bits per quarter (bits 0-1 top-left, 2-3 top-right, 4-5 bottom-left, 6-7 bottom-right):
   0 = off, 1/2/3 = the 25/50/75% pattern tile art.dither[level-1]. Wherever the pattern is set the pixel is painted palette colour 0 (black by default),
   whatever the tile underneath looks like, inverted or not. */
/* a quarter is fully black when every pixel of it shows palette colour 0, glyph and inversion considered; dither there would be invisible, so it is never kept */
const quadBlack=(a,m,q)=>{const x0=(q&1)*4,y0=(q>>1)*4;for(let j=y0;j<y0+4;j++)for(let i=x0;i<x0+4;i++)if((a.glyphs[m.glyph][j]>>(7-i)&1?m.fg:m.bg)!==0)return false;return true},
 cleanD=(a,m)=>{let d=m.d|0;for(let q=0;q<4;q++)if((d>>q*2&3)&&quadBlack(a,m,q))d&=~(3<<q*2);return d};
const dith=(a,d,i,j)=>{const l=d>>(((j>>2)*2+(i>>2))*2)&3;return l?a.dither[l-1][j]>>(7-i)&1:0};
function drawGlyph(c,a,g,fg,bg,x,y,s,d=0){c.fillStyle=bg;c.fillRect(x,y,8*s,8*s);const r=a.glyphs[g];
 for(let j=0;j<8;j++)for(let i=0;i<8;i++){const k=dith(a,d,i,j);if(k||(r[j]>>(7-i)&1)){c.fillStyle=k?a.palette[0]:fg;c.fillRect(x+i*s,y+j*s,s,s)}}}
function lines(c,cell,n,col){c.fillStyle=col;for(let k=1;k<n;k++){c.fillRect(k*cell,0,1,n*cell);c.fillRect(0,k*cell,n*cell,1)}}
function renderArt(c,a,s,grid){c.imageSmoothingEnabled=false;
 for(let i=0;i<64;i++){const m=a.map[i];drawGlyph(c,a,m.glyph,a.palette[m.fg],a.palette[m.bg],(i%8)*8*s,(i>>3)*8*s,s,m.d|0)}
 if(grid)lines(c,8*s,8,"rgba(255,255,255,.16)")}

/* ---------- cartridge codec ---------- */
function crc32(b){let r=-1;for(let i=0;i<b.length;i++){r^=b[i];for(let k=0;k<8;k++)r=r&1?(r>>>1)^0xEDB88320:r>>>1}return(r^-1)>>>0}
function serialize(a){const meta=new TextEncoder().encode(JSON.stringify(a.metadata)),n=153+meta.length;
 if(n>CAP)throw Error(`Metadata too long: payload is ${n} bytes, capacity ${CAP}. Remove about ${n-CAP} bytes of text.`);
 const o=new Uint8Array(n);o.set([84,73,76,69,a.version,meta.length&255,meta.length>>8]);let p=7;
 a.palette.forEach(c=>{for(let k=0;k<3;k++)o[p++]=parseInt(c.substr(1+2*k,2),16)});
 let acc=0,nb=0;for(const m of a.map){acc=acc<<14|m.glyph<<10|m.fg<<9|m.bg<<8|((m.d|0)&255);nb+=14;while(nb>=8){o[p++]=acc>>(nb-8)&255;nb-=8}acc&=(1<<nb)-1}
 a.dither.forEach(q=>q.forEach(r=>o[p++]=r));o.set(meta,p);p+=meta.length;new DataView(o.buffer).setUint32(p,crc32(o.subarray(0,p)),true);return o}
function readBytes(d,n){const o=new Uint8Array(n);for(let i=0;i<n*8;i++){const p=(i>>1)*4+1+(i&1);o[i>>3]=o[i>>3]<<1|d[p]&1}return o}
function readDither(d){return Array.from({length:3},(_,k)=>Array.from({length:8},(_,j)=>{let r=0;for(let x=0;x<8;x++)r=r<<1|d[((32+j)*64+k*8+x)*4]&1;return r}))}
function readGlyphs(d){return Array.from({length:16},(_,g)=>Array.from({length:8},(_,j)=>{let r=0;for(let x=0;x<8;x++)r=r<<1|d[(((g>>2)*8+j)*64+(g&3)*8+x)*4]&1;return r}))}
function parse(d){const h=readBytes(d,7);
 if(String.fromCharCode(...h.subarray(0,4))!=="TILE")throw Object.assign(Error("Not a Tilecart image: signature not found."),{noSig:1});
 if(h[4]<4||h[4]>7)throw Error("Unsupported cartridge version "+h[4]+" (this editor reads versions 4 to 7).");
 const ml=h[5]|h[6]<<8,n=({4:65,5:97,6:129,7:153})[h[4]]+ml;if(n>CAP)throw Error("Corrupt header: declared length exceeds capacity.");
 const b=readBytes(d,n);if(new DataView(b.buffer).getUint32(n-4,true)!==crc32(b.subarray(0,n-4)))
  throw Error("Checksum mismatch. The PNG was probably re-encoded or edited.");
 const a=def();let p=7;
 p+=6; /* the palette is fixed to true black and white */
 a.glyphs=readGlyphs(d);a.dither=h[4]===6?readDither(d):famTiles("Checker");
 {const w=({4:6,5:10,6:14,7:14})[h[4]],up=b4=>(b4&1)<<1|(b4>>1&1)<<3|(b4>>2&1)<<5|(b4>>3&1)<<7;let acc=0,nb=0,i=0;while(i<64){acc=acc<<8|b[p++];nb+=8;while(nb>=w&&i<64){nb-=w;const v=acc>>nb&(1<<w)-1;a.map[i++]=w===6?{glyph:v>>2,fg:v>>1&1,bg:v&1,d:0}:w===10?{glyph:v>>6,fg:v>>5&1,bg:v>>4&1,d:up(v&15)}:{glyph:v>>10,fg:v>>9&1,bg:v>>8&1,d:v&255}}acc&=(1<<nb)-1}}
 if(h[4]===7)a.dither=[0,1,2].map(()=>{const q=[...b.subarray(p,p+8)];p+=8;return q});
 a.map.forEach(m=>{m.d=cleanD(a,m)});
 let m;try{m=JSON.parse(new TextDecoder().decode(b.subarray(p,p+ml)))}catch{throw Error("Metadata is not valid JSON.")}
 for(const k of MF)a.metadata[k]=String(m[k]??"");return a}
function cover(a){const d=new Uint8Array(64*64*4),pal=a.palette.map(c=>[1,3,5].map(k=>parseInt(c.substr(k,2),16)));
 for(let y=0;y<64;y++)for(let x=0;x<64;x++){const m=a.map[(y>>3)*8+(x>>3)],on=a.glyphs[m.glyph][y&7]>>(7-(x&7))&1,k=dith(a,m.d|0,x&7,y&7),c=pal[k?0:on?m.fg:m.bg],p=(y*64+x)*4;
  d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255}return d}
function encodePNG(px,w=64,h=w){const W=w*4,raw=new Uint8Array(h*(W+1));for(let y=0;y<h;y++)raw.set(px.subarray(y*W,y*W+W),y*(W+1)+1);
 let s1=1,s2=0;for(const v of raw){s1=(s1+v)%65521;s2=(s2+s1)%65521}
 const L=raw.length,z=new Uint8Array(7+L+4);z.set([0x78,1,1,L&255,L>>8,~L&255,~L>>8&255]);z.set(raw,7);
 new DataView(z.buffer).setUint32(7+L,(s2<<16|s1)>>>0);
 const ch=(t,d)=>{const o=new Uint8Array(12+d.length),v=new DataView(o.buffer);v.setUint32(0,d.length);
  for(let i=0;i<4;i++)o[4+i]=t.charCodeAt(i);o.set(d,8);v.setUint32(8+d.length,crc32(o.subarray(4,8+d.length)));return o};
 const ih=new Uint8Array(13),iv=new DataView(ih.buffer);iv.setUint32(0,w);iv.setUint32(4,h);ih[8]=8;ih[9]=6;
 return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]),ch("IHDR",ih),ch("IDAT",z),ch("IEND",new Uint8Array(0))],{type:"image/png"})}
function toPNG(a){const data=serialize(a),d=cover(a);
 for(let i=0;i<data.length*8;i++){const bit=data[i>>3]>>(7-(i&7))&1,p=(i>>1)*4+1+(i&1);d[p]=d[p]&254|bit}
 a.glyphs.forEach((q,g)=>q.forEach((r,j)=>{for(let x=0;x<8;x++){const p=(((g>>2)*8+j)*64+(g&3)*8+x)*4;d[p]=d[p]&254|r>>(7-x)&1}}));
