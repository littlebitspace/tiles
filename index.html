<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#16141c;--pn:#221f2c;--ln:#3b3650;--tx:#e6e1ee;--ac:#ffc233;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--pn);border-bottom:1px solid var(--ln);align-items:center}
button{font:inherit;color:var(--tx);background:#2e2a42;border:1px solid var(--ln);padding:6px 10px;border-radius:3px;min-height:40px;touch-action:manipulation}

button:disabled{opacity:.35}

.sp{flex:1}

#msg.err{color:#ff7a7a}
main{flex:1;overflow:auto;padding:8px}
.view{display:none;max-width:540px;margin:0 auto}.view.on{display:block}
canvas{display:block;image-rendering:pixelated;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;border:1px solid var(--ln);background:#000;margin:0 auto}
#bd{width:min(100%,54dvh)}
#ge{width:min(100%,288px)}#gc,#go{width:min(100%,320px)}
.row{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;align-items:center}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0 8px}
.s{height:38px;padding:0}.s.on{outline:3px solid var(--ac);outline-offset:1px}
summary{padding:8px 0;cursor:pointer}
h3{margin:16px 0 6px;font-size:14px;font-weight:700}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{display:flex;flex-direction:column;gap:2px;font-size:11px;text-align:center}
.pc input{width:100%;height:40px;padding:0;border:1px solid var(--ln);background:none}
.mf{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.mf input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);padding:8px;border-radius:3px}
/* pixel skin: hard edges, bevelled buttons, stepped shadows, dithered ground */
:root{--bg:#1a1626;--pn:#262038;--ln:#463d66;--hi:#6a5f96;--lo:#0d0a15;--tx:#ece6f6}
html,body{font:15px/1.3 "Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:none;background:conic-gradient(#1d1930 25%,#1a1626 0 50%,#1d1930 0 75%,#1a1626 0) 0 0/8px 8px}
header{background:var(--pn);border-bottom:4px solid var(--lo);box-shadow:0 4px 0 var(--ln)}
button{border:3px solid var(--lo);border-radius:0;background:var(--ln);padding:4px 10px;min-height:42px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.18)}
button:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.4),inset -3px -3px 0 rgba(255,255,255,.1)}
button.on{background:var(--ac);color:#1a1100;border-color:var(--lo)}
.s{min-height:0}.s.on{outline:3px solid #fff;outline-offset:0}
canvas{border:3px solid var(--lo);box-shadow:0 0 0 3px var(--hi),4px 4px 0 3px var(--lo)}
.pc input{border:3px solid var(--lo);border-radius:0}
.mf input{border:3px solid var(--lo);border-radius:0;background:#120e1c;box-shadow:inset 3px 3px 0 rgba(0,0,0,.45)}
h3{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:16px}
h3::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--hi) 0 4px,transparent 4px 8px)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--ac)}details[open]>summary::before{content:"- "}
#msg{padding:4px 8px;min-height:26px}
button u{text-underline-offset:2px}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ic{width:24px;height:24px;display:block;fill:currentColor;shape-rendering:crispEdges;pointer-events:none}
#tip{position:fixed;z-index:50;background:#000;color:#fff;border:2px solid var(--ac,#fff);padding:3px 8px;font-size:13px;max-width:260px;pointer-events:none}
/* canvas view: board over glyph sheet on the left, one vertical stack of grouped controls on the right */
:root{--bs:min(calc(100vw - 124px),38dvh)}
#cv{display:grid;gap:8px;justify-content:center;align-items:start;grid-template-columns:var(--bs) 92px;grid-template-areas:"bd rc" "gc rc"}
#cv #bd,#cv #gc{width:var(--bs);height:var(--bs);margin:0}#bd{grid-area:bd}#gc{grid-area:gc}#rc{grid-area:rc}
#rc,#wc{display:flex;flex-direction:column;gap:8px}
#rc>*+*,#wc>*+*{border-top:3px dotted var(--ln);padding-top:8px}

#rc button,#wc button{min-height:40px;padding:2px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.18)}
#rc .ic,#wc .ic{margin:auto}
.cl{font-size:12px;margin:0 0 2px}
#rc .sw{margin:0 0 6px;gap:3px}#rc .s{height:26px;border-width:2px}
#bp{width:44px;height:44px;margin:4px 0 0;box-shadow:none;border-width:2px}
#wk{display:grid;gap:8px;justify-content:center;align-items:start;grid-template-columns:var(--bs) 92px;grid-template-areas:"ge wc" "go wc"}
#wk #ge,#wk #go{width:var(--bs);height:var(--bs);margin:0}#ge{grid-area:ge}#go{grid-area:go}#wc{grid-area:wc}
@media (orientation:landscape) and (max-height:560px){
 #vW{max-width:none}
 #wk{grid-template-columns:var(--bs) 92px var(--bs);grid-template-areas:"ge wc go"}
 :root{--bs:min(calc(100dvh - 120px),calc((100vw - 140px)/2))}

 #cv{grid-template-columns:var(--bs) 92px var(--bs);grid-template-areas:"bd rc gc"}}

#cp .box{background:var(--pn,#241f35);border:4px solid var(--lo);padding:10px;width:min(100%,360px)}

.cpf{margin-top:10px}.cpf button{width:100%}
.pcb{width:100%;height:40px;min-height:0;padding:0;border:3px solid var(--lo)}

<header>

<div class="cg"><div class="cl"><u>F</u>G</div><div class="sw" id="sf"></div><div class="cl"><u>B</u>G</div><div class="sw" id="sb"></div><canvas id="bp" width="8" height="8"></canvas></div>
</div>

</div>

<script>
"use strict";
/* TILE cartridge format v3  (64x64 RGBA PNG; data lives in the LSBs, 1 bit per channel)
   Alpha is always 255 and unused. The visible pixels are the artwork (each tile = 8x8 px).
   Red LSB plane = the tile set, pixel for pixel: a 64x64 sheet of 8x8 glyphs in reading order (glyph g at column g%8, row g>>3),
     bit 1 = set pixel, leftmost pixel = leftmost bit. A black/white tile-set image therefore already is a valid plane.
   Green and Blue LSBs = payload stream: pixel order left->right, top->bottom, G then B; bytes MSB first. Capacity 4096*2/8 = 1024 bytes.
   Payload (all multi-byte ints little-endian):
     0  "TILE" (4)   4  version (3)   5  metaLen u16   7  palette 3x RGB (9)
     16 map 64 x 10 bits (glyph6|fg2|bg2; colours 0-2), packed back to back, first entry in the high bits (80)
     96 metadata UTF-8 JSON {author,group,title,date} (metaLen)   then CRC-32 of all preceding payload bytes (4)
   The CRC does not cover the tile set plane, so a tile set can be edited in an image editor.
   Versions 1 and 2 are not readable by this editor. */
const CAP=1024,MF=["author","group","title","date"],$=id=>document.getElementById(id);
const G=[[0,0,0,0,0,0,0,0],[255,255,255,255,255,255,255,255],[170,85,170,85,170,85,170,85],[170,0,170,0,170,0,170,0],[192,192,192,192,192,192,192,192],[48,48,48,48,48,48,48,48],[12,12,12,12,12,12,12,12],[3,3,3,3,3,3,3,3],[0,0,60,60,60,60,0,0],[0,24,60,126,126,60,24,0],[240,240,240,240,240,240,240,240],[0,0,0,0,255,255,255,255],[0,0,0,0,0,0,255,255],[0,0,0,0,255,255,0,0],[0,0,255,255,0,0,0,0],[255,255,0,0,0,0,0,0],[7,31,63,127,127,255,255,255],[224,248,252,254,254,255,255,255],[0,0,0,0,3,7,15,15],[0,0,0,0,192,224,240,240],[7,31,60,112,96,224,192,192],[224,248,60,14,6,7,3,3],[0,0,0,0,3,7,14,12],[0,0,0,0,192,224,112,48],[255,255,255,127,127,63,31,7],[255,255,255,254,254,252,248,224],[15,15,7,3,0,0,0,0],[240,240,224,192,0,0,0,0],[192,192,224,96,112,60,31,7],[3,3,7,6,14,60,248,224],[12,14,7,3,0,0,0,0],[48,112,224,192,0,0,0,0],[3,7,15,15,15,15,7,3],[0,0,0,0,60,126,255,255],[0,0,0,0,15,15,15,15],[0,0,0,0,240,240,240,240],[255,255,192,192,192,192,192,192],[255,255,3,3,3,3,3,3],[0,0,0,0,15,15,12,12],[0,0,0,0,240,240,48,48],[255,255,126,60,0,0,0,0],[192,224,240,240,240,240,224,192],[15,15,15,15,0,0,0,0],[240,240,240,240,0,0,0,0],[192,192,192,192,192,192,255,255],[3,3,3,3,3,3,255,255],[12,12,15,15,0,0,0,0],[48,48,240,240,0,0,0,0],[10,0,10,0,10,0,10,0],[0,0,0,0,170,0,170,0],[10,5,10,5,10,5,10,5],[0,0,0,0,170,85,170,85],[10,15,10,15,10,15,10,15],[0,0,0,0,170,255,170,255],[1,3,7,15,31,63,127,255],[128,192,224,240,248,252,254,255],[170,0,170,0,0,0,0,0],[160,0,160,0,160,0,160,0],[170,85,170,85,0,0,0,0],[160,80,160,80,160,80,160,80],[170,255,170,255,0,0,0,0],[160,240,160,240,160,240,160,240],[0,60,126,126,126,126,60,0],[160,160,182,148,150,146,86,0]];
const def=()=>({version:3,metadata:{author:"",group:"",title:"",date:new Date().toISOString().slice(0,10)},
 palette:["#000000","#808080","#ffffff"],
 glyphs:Array.from({length:64},(_,i)=>Array.from({length:8},(_,j)=>G[i]?G[i][j%G[i].length]:0)),
 map:Array.from({length:64},()=>({glyph:0,fg:2,bg:0}))});

/* ---------- renderer (pure canvas drawing) ---------- */
function drawGlyph(c,a,g,fg,bg,x,y,s){c.fillStyle=bg;c.fillRect(x,y,8*s,8*s);c.fillStyle=fg;const r=a.glyphs[g];
 for(let j=0;j<8;j++)for(let i=0;i<8;i++)if(r[j]>>(7-i)&1)c.fillRect(x+i*s,y+j*s,s,s)}
function lines(c,cell,n,col){c.fillStyle=col;for(let k=1;k<n;k++){c.fillRect(k*cell,0,1,n*cell);c.fillRect(0,k*cell,n*cell,1)}}
function renderArt(c,a,s,grid){c.imageSmoothingEnabled=false;
 for(let i=0;i<64;i++){const m=a.map[i];drawGlyph(c,a,m.glyph,a.palette[m.fg],a.palette[m.bg],(i%8)*8*s,(i>>3)*8*s,s)}
 if(grid)lines(c,8*s,8,"rgba(255,255,255,.16)")}

/* ---------- cartridge codec ---------- */
function crc32(b){let r=-1;for(let i=0;i<b.length;i++){r^=b[i];for(let k=0;k<8;k++)r=r&1?(r>>>1)^0xEDB88320:r>>>1}return(r^-1)>>>0}
function serialize(a){const meta=new TextEncoder().encode(JSON.stringify(a.metadata)),n=100+meta.length;
 if(n>CAP)throw Error(`Metadata too long: payload is ${n} bytes, capacity ${CAP}. Remove about ${n-CAP} bytes of text.`);
 const o=new Uint8Array(n);o.set([84,73,76,69,a.version,meta.length&255,meta.length>>8]);let p=7;
 a.palette.forEach(c=>{for(let k=0;k<3;k++)o[p++]=parseInt(c.substr(1+2*k,2),16)});
 let acc=0,nb=0;for(const m of a.map){acc=acc<<10|m.glyph<<4|m.fg<<2|m.bg;nb+=10;while(nb>=8){o[p++]=acc>>(nb-8)&255;nb-=8}acc&=(1<<nb)-1}
 o.set(meta,p);p+=meta.length;new DataView(o.buffer).setUint32(p,crc32(o.subarray(0,p)),true);return o}
function readBytes(d,n){const o=new Uint8Array(n);for(let i=0;i<n*8;i++){const p=(i>>1)*4+1+(i&1);o[i>>3]=o[i>>3]<<1|d[p]&1}return o}
function readGlyphs(d){return Array.from({length:64},(_,g)=>Array.from({length:8},(_,j)=>{let r=0;for(let x=0;x<8;x++)r=r<<1|d[(((g>>3)*8+j)*64+(g&7)*8+x)*4]&1;return r}))}
function parse(d){const h=readBytes(d,7);
 if(String.fromCharCode(...h.subarray(0,4))!=="TILE")throw Object.assign(Error("Not a Tilecart image: signature not found."),{noSig:1});
 if(h[4]!==3)throw Error("Unsupported cartridge version "+h[4]+" (this editor reads version 3).");
 const ml=h[5]|h[6]<<8,n=100+ml;if(n>CAP)throw Error("Corrupt header: declared length exceeds capacity.");
 const b=readBytes(d,n);if(new DataView(b.buffer).getUint32(n-4,true)!==crc32(b.subarray(0,n-4)))
  throw Error("Checksum mismatch. The PNG was probably re-encoded or edited.");
 const a=def();let p=7;
 a.palette=[...Array(3)].map(()=>"#"+[0,1,2].map(()=>b[p++].toString(16).padStart(2,"0")).join(""));
 a.glyphs=readGlyphs(d);
 {let acc=0,nb=0,i=0;while(i<64){acc=acc<<8|b[p++];nb+=8;while(nb>=10&&i<64){nb-=10;const v=acc>>nb&1023;a.map[i++]={glyph:v>>4,fg:Math.min(2,v>>2&3),bg:Math.min(2,v&3)}}acc&=(1<<nb)-1}}
 let m;try{m=JSON.parse(new TextDecoder().decode(b.subarray(p,p+ml)))}catch{throw Error("Metadata is not valid JSON.")}
 for(const k of MF)a.metadata[k]=String(m[k]??"");return a}
function cover(a){const d=new Uint8Array(64*64*4),pal=a.palette.map(c=>[1,3,5].map(k=>parseInt(c.substr(k,2),16)));
 for(let y=0;y<64;y++)for(let x=0;x<64;x++){const m=a.map[(y>>3)*8+(x>>3)],on=a.glyphs[m.glyph][y&7]>>(7-(x&7))&1,c=pal[on?m.fg:m.bg],p=(y*64+x)*4;
  d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255}return d}
function encodePNG(px){const raw=new Uint8Array(64*257);for(let y=0;y<64;y++)raw.set(px.subarray(y*256,y*256+256),y*257+1);
 let s1=1,s2=0;for(const v of raw){s1=(s1+v)%65521;s2=(s2+s1)%65521}
 const L=raw.length,z=new Uint8Array(7+L+4);z.set([0x78,1,1,L&255,L>>8,~L&255,~L>>8&255]);z.set(raw,7);
 new DataView(z.buffer).setUint32(7+L,(s2<<16|s1)>>>0);
 const ch=(t,d)=>{const o=new Uint8Array(12+d.length),v=new DataView(o.buffer);v.setUint32(0,d.length);
  for(let i=0;i<4;i++)o[4+i]=t.charCodeAt(i);o.set(d,8);v.setUint32(8+d.length,crc32(o.subarray(4,8+d.length)));return o};
 const ih=new Uint8Array(13),iv=new DataView(ih.buffer);iv.setUint32(0,64);iv.setUint32(4,64);ih[8]=8;ih[9]=6;
 return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]),ch("IHDR",ih),ch("IDAT",z),ch("IEND",new Uint8Array(0))],{type:"image/png"})}
function toPNG(a){const data=serialize(a),d=cover(a);
 for(let i=0;i<data.length*8;i++){const bit=data[i>>3]>>(7-(i&7))&1,p=(i>>1)*4+1+(i&1);d[p]=d[p]&254|bit}
 a.glyphs.forEach((q,g)=>q.forEach((r,j)=>{for(let x=0;x<8;x++){const p=(((g>>3)*8+j)*64+(g&7)*8+x)*4;d[p]=d[p]&254|r>>(7-x)&1}}));
 return encodePNG(d)}
async function loadPNG(f){let bm;
 try{bm=await createImageBitmap(f,{premultiplyAlpha:"none",colorSpaceConversion:"none"})}catch{throw Error("Could not decode this file as a PNG image.")}
 if(bm.width!==64||bm.height!==64)throw Error(`Cartridge must be 64×64 px, this image is ${bm.width}×${bm.height}.`);
 const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bm,0,0);
 return parse(x.getImageData(0,0,64,64).data)}

/* tile-set sheet images: 64x64, 8x8 tiles of 8x8 px; a pixel counts as set when opaque and lighter than 50% */
function tilesetPixels(a){const d=new Uint8Array(64*64*4);a.glyphs.forEach((q,g)=>q.forEach((r,j)=>{for(let x=0;x<8;x++){const p=(((g>>3)*8+j)*64+(g&7)*8+x)*4,v=r>>(7-x)&1?255:0;d[p]=d[p+1]=d[p+2]=v;d[p+3]=255}}));return d}
async function loadTileset(f){let bm;try{bm=await createImageBitmap(f,{premultiplyAlpha:"none",colorSpaceConversion:"none"})}catch{throw Error("Could not decode this file as an image.")}
 if(bm.width!==64||bm.height!==64)throw Error(`Tile set must be 64×64 px (8×8 tiles of 8×8 px), this image is ${bm.width}×${bm.height}.`);
 const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bm,0,0);const d=x.getImageData(0,0,64,64).data;

 if(sync){pin.forEach(([i,h],k)=>{i.style.background=art.palette[k];h.textContent=art.palette[k]});MF.forEach(k=>$("m_"+k).value=art.metadata[k])}}
function tab(w){$("vC").classList.toggle("on",!w);$("vW").classList.toggle("on",w);$("tC").className=w?"":"on";$("tW").className=w?"on":"";refresh()}
$("grot").onclick=()=>{snap();art.glyphs[brush.glyph]=fromFn(art.glyphs[brush.glyph],rotF);refresh()};
let nwT,nwOn=false;$("nw").onclick=()=>{const b=$("nw");
 if(!nwOn){nwOn=true;b.className="on";nwT=setTimeout(()=>{nwOn=false;b.className=""},4000);say("Tap again to clear tiles, glyphs, palette and metadata. Undo restores them.");return}
 clearTimeout(nwT);nwOn=false;b.className="";commitSel();snap();art=def();refresh(true);say("New file")};
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>selOp(b.dataset.o));$("selok").onclick=commitSel;
$("selst").onclick=()=>{if(!sel)return;snap();art.map=flat().map;refresh();say("Stamped")};
$("selt").onclick=()=>{trans=!trans;const e=art.glyphs.findIndex(q=>!q.some(r=>r));refresh();say(trans?(e<0?"Transparent on, but no empty glyph exists":"Transparent: glyph #"+e+" no longer covers tiles"):"Transparent off")};
function delSel(){if(!sel)return;sel=null;refresh();say("Selection deleted")}
$("seldel").onclick=delSel;
document.querySelectorAll("#modes [data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;refresh()});
$("tC").onclick=()=>tab(0);$("tW").onclick=()=>tab(1);$("un").onclick=doUndo;$("re").onclick=doRedo;
for(const k of["fh","fv"])$("g"+k).onclick=()=>{snap();art.glyphs[brush.glyph]=fromFn(art.glyphs[brush.glyph],GF[k]);refresh()};
$("gcl").onclick=()=>{snap();art.glyphs[brush.glyph]=Array(8).fill(0);refresh()};
$("ginv").onclick=()=>{snap();art.glyphs[brush.glyph]=art.glyphs[brush.glyph].map(r=>~r&255);refresh()};
$("gcp").onclick=()=>{clip=[...art.glyphs[brush.glyph]];say("Glyph copied")};
$("gps").onclick=()=>{if(clip){snap();art.glyphs[brush.glyph]=[...clip];refresh()}};
async function save(blob,name){const d=window.claude&&claude.use?await claude.use("downloads"):null;
 if(d)await d.save({filename:name,data:blob});else{const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),5000)}say("Saved "+name)}
const fname=x=>(art.metadata.title||"untitled").replace(/[^\w-]+/g,"_")+x,saveErr=e=>say(e.code==="declined"?"Save cancelled":e.message,1);
$("ex").onclick=async()=>{try{await save(toPNG(flat()),fname(".tile.png"))}catch(e){saveErr(e)}};
$("tse").onclick=async()=>{try{await save(encodePNG(tilesetPixels(art)),fname(".tileset.png"))}catch(e){saveErr(e)}};
$("tsi").onclick=()=>$("tsf").click();
$("tsf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const g=await loadTileset(f);snap();art.glyphs=g;refresh();say("Tile set imported")}catch(x){say(x.message,1)}};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const n=await loadPNG(f);commitSel();snap();art=n;refresh(true);say("Loaded "+f.name)}catch(x){
  if(!x.noSig){say(x.message,1);return}
  try{const g=await loadTileset(f);commitSel();snap();art.glyphs=g;refresh();say("No cartridge found, so "+f.name+" was imported as a tile set")}catch(y){say(y.message,1)}}};
/* ---------- keyboard shortcuts ---------- */
let sclip=null,ptr=[0,0];
$("bd").addEventListener("pointermove",e=>{const[x,y]=cellF(e);ptr=[cl(x),cl(y)]});
function copySel(){if(!sel)return;sclip={w:sel.w,h:sel.h,cells:sel.cells.map(c=>c&&{...c})};say("Selection copied")}
function pasteSel(){if(!sclip){say("Nothing copied yet",1);return}commitSel();snap();sel={x:Math.min(ptr[0],8-sclip.w),y:Math.min(ptr[1],8-sclip.h),w:sclip.w,h:sclip.h,cells:sclip.cells.map(c=>c&&{...c})};refresh();say("Pasted: drag to move, P to place")}
const MODES={char:"colour",colour:"both",both:"char"};
addEventListener("keydown",e=>{
 const t=e.target;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)return;
 if(!$("cp").hidden){if(e.key==="Escape"){e.preventDefault();$("cp").hidden=true}return}
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),c=e.code,ws=$("vW").classList.contains("on"),
  go=f=>{e.preventDefault();f()},click=id=>go(()=>$(id).click());
 if(e.repeat&&!(mod&&(k==="z"||k==="y"))&&!/^Key[WASD]$/.test(c))return;
 if(mod||e.altKey){ /* Alt works as a stand-in for Ctrl on 1, 2 and N, which browsers often reserve */
  if(c==="Digit1")return go(()=>tab(0));if(c==="Digit2")return go(()=>tab(1));if(c==="KeyN")return click("nw");
  if(!mod)return;
  if(k==="c"&&(ws||sel))return ws?click("gcp"):go(copySel);if(k==="v")return ws?click("gps"):go(pasteSel);
  if(k==="z")return go(e.shiftKey?doRedo:doUndo);if(k==="y")return go(doRedo);
  if(k==="s")return click("ex");if(k==="o")return click("im");
  if(ws&&k==="i")return click("tsi");if(ws&&k==="e")return click("tse");
  return}
 if(!ws&&sel){if(k==="s")return click("selst");if(k==="p")return click("selok")}
 const W={KeyW:[0,-1],KeyA:[-1,0],KeyS:[0,1],KeyD:[1,0]}[c];
 if(W){const x=(brush.glyph&7)+W[0],y=(brush.glyph>>3)+W[1];return go(()=>{brush.glyph=((y+8)%8)*8+(x+8)%8;tileTool();buildTools();refresh()})}
 if(k==="f"||k==="b"){const q=k==="f"?"fg":"bg",n=art.palette.length;return go(()=>{brush[q]=(brush[q]+(e.shiftKey?n-1:1))%n;refresh()})} /* Shift reverses */
 const del=e.key==="Delete"||e.key==="Backspace";
 if("rhvi".includes(k)&&k.length===1)return go(()=>ws?$({r:"grot",h:"gfh",v:"gfv",i:"ginv"}[k]).click():selOp({r:"rot",h:"fh",v:"fv",i:"inv"}[k]));
 if(ws){if(k==="c")return click("gcp");if(k==="p")return click("gps");if(del)return click("gcl");return}
 if(k==="g")return go(()=>{showGrid=!showGrid;buildTools();draw()});
 const n="12345".indexOf(e.key);if(n>=0&&e.key.length===1)return go(()=>setTool(["paint","fill","replace","pick","erase"][n]));
 if(k==="m")return go(()=>{mode=MODES[mode];refresh();say("Mode: "+mode)});
 if(!sel)return;
 if(k==="c")return go(copySel);if(k==="t")return click("selt");if(del)return go(delSel)});
/* ---------- autosave: the whole working state goes to localStorage a moment after every change and when the page is hidden; undo history is not kept ---------- */
const KEY="tilecart:autosave:1",TOOLS=["paint","fill","replace","pick","erase"],MODE_NAMES=["char","colour","both"];
let asT,asWarned=false;
function autosave(){clearTimeout(asT);asT=setTimeout(saveState,400)}
function saveState(){clearTimeout(asT);try{localStorage.setItem(KEY,JSON.stringify({v:1,art,brush:{...brush},mode,showGrid,trans,sel,clip,sclip,w:$("vW").classList.contains("on")}))}catch(e){if(!asWarned){asWarned=true;say("Autosave is unavailable in this browser",1)}}}
const okI=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi,okC=c=>!!c&&okI(c.glyph,0,63)&&okI(c.fg,0,2)&&okI(c.bg,0,2),okG=q=>Array.isArray(q)&&q.length===8&&q.every(r=>okI(r,0,255)),
 okS=z=>!!z&&okI(z.w,1,8)&&okI(z.h,1,8)&&Array.isArray(z.cells)&&z.cells.length===z.w*z.h&&z.cells.every(c=>c===null||okC(c)),cp=c=>c&&{glyph:c.glyph,fg:c.fg,bg:c.bg};
function restoreState(){try{const st=JSON.parse(localStorage.getItem(KEY)),a=st&&st.art;if(!st||st.v!==1||!a)return false;
 if(!(Array.isArray(a.palette)&&a.palette.length===3&&a.palette.every(c=>/^#[0-9a-f]{6}$/i.test(c))&&Array.isArray(a.glyphs)&&a.glyphs.length===64&&a.glyphs.every(okG)&&Array.isArray(a.map)&&a.map.length===64&&a.map.every(okC)&&a.metadata&&typeof a.metadata==="object"))return false;
 const md={};MF.forEach(k=>md[k]=typeof a.metadata[k]==="string"?a.metadata[k].slice(0,200):"");
 art={...def(),palette:a.palette.map(c=>c.toLowerCase()),glyphs:a.glyphs.map(q=>[...q]),map:a.map.map(cp),metadata:md};
 const b=st.brush||{};if(okI(b.glyph,0,63))brush.glyph=b.glyph;if(okI(b.fg,0,2))brush.fg=b.fg;if(okI(b.bg,0,2))brush.bg=b.bg;if(TOOLS.includes(b.tool))brush.tool=b.tool;
 if(MODE_NAMES.includes(st.mode))mode=st.mode;if(typeof st.showGrid==="boolean")showGrid=st.showGrid;if(typeof st.trans==="boolean")trans=st.trans;
 clip=okG(st.clip)?[...st.clip]:null;sclip=okS(st.sclip)?{w:st.sclip.w,h:st.sclip.h,cells:st.sclip.cells.map(cp)}:null;
 const z=st.sel;sel=okS(z)&&okI(z.x,-8,8)&&okI(z.y,-8,8)?{x:z.x,y:z.y,w:z.w,h:z.h,cells:z.cells.map(cp)}:null;
 return !!st.w}catch(e){return false}}
addEventListener("pagehide",saveState);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveState()});
const startW=restoreState();
buildTools();refresh(true);if(startW)tab(1);
</script></body></html>
